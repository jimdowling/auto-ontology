name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'auto_ontology/server/static/**'

defaults:
  run:
    working-directory: frontend

jobs:
  lint_and_build:
    name: Prettier, ESLint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install pnpm
        # Held at v4: the enterprise action allowlist does not admit v5, and a
        # blocked action fails the workflow before any step runs. The Node 20
        # deprecation warning it emits is the lesser cost.
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Hopsworks installs the package from git, so the UI it serves is the committed build.
      - name: Committed UI build is current
        run: |
          git status --porcelain -- ../auto_ontology/server/static
          test -z "$(git status --porcelain -- ../auto_ontology/server/static)" \
            || { echo "Run pnpm build in frontend/ and commit auto_ontology/server/static" >&2; exit 1; }

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test
