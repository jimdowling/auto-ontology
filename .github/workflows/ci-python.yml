name: Auto Ontology CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'auto_ontology/**'
      - 'dev_tools/**'
      - 'docs/openapi/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci-python.yml'

jobs:
  lint_and_format:
    name: Ruff Check & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.16.5'
          args: check
          src: './auto_ontology ./dev_tools'
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.16.5'
          args: format --check
          src: './auto_ontology ./dev_tools'

  tests:
    name: Pytest on MySQL NDB Cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra kumo

      - name: Start the NDB cluster
        run: docker compose -f dev_tools/ndb/docker-compose.yml up -d --wait

      - name: Run the test suite
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '33306'
          MYSQL_USER: root
          MYSQL_PASSWORD: ndbtest
          MYSQL_DB: ontology
          AUTO_ONTOLOGY_VDB: memory
        run: uv run --no-sync pytest auto_ontology dev_tools -q --durations=10

      - name: Fail if the committed API spec is stale
        run: |
          uv run --no-sync python -m dev_tools.generate_backend_openapi
          git diff --exit-code docs/openapi/backend.json
