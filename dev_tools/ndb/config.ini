[ndbd default]
NoOfReplicas=1
DataMemory=1G
# RonDB caps a transaction at 32768 changed rows; keep the local cluster at the same limit.
MaxNoOfConcurrentOperations=32768
MaxNoOfTables=1024
MaxNoOfOrderedIndexes=2048
MaxNoOfUniqueHashIndexes=1024
MaxNoOfAttributes=20000

[ndb_mgmd]
NodeId=1
HostName=172.31.250.2
DataDir=/var/lib/mysql

[ndbd]
NodeId=2
HostName=172.31.250.3
DataDir=/var/lib/mysql

[mysqld]
NodeId=10
HostName=172.31.250.10
